<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Krishvi's Star Garden</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Baloo+Tamma+2:wght@500;700&family=Andika:wght@400;700&display=swap">
<style>
:root{
  --pink:#ff3e8a; --pink-deep:#d81b6a; --bubble:#ffb3d1; --blush:#ffe3ef; --ground:#fff4f9;
  --berry:#4f0d33; --berry-soft:#8a4a6c; --lemon:#ffd23f; --mint:#2fd39a; --sky:#47b4f5;
  --lilac:#a66cff; --orange:#ff8a3d; --coral:#ff6b6b; --white:#ffffff;
  --ok:#21b36b; --bad:#ff5a5a;
  --c-english:#ff3e8a; --c-maths:#3ba7f0; --c-kannada:#f2a900; --c-rhymes:#a66cff;
  --c-hindi:#ff8a3d; --c-gk:#22b573; --c-story:#ff6b6b; --c-evs:#19bfa0; --c-activity:#e05cc8; --c-drawing:#7b61ff;
  --font:"Baloo 2","Baloo Tamma 2","Nirmala UI","Kohinoor Devanagari",system-ui,sans-serif;
  --font-print:"Andika","Baloo 2","Baloo Tamma 2",system-ui,sans-serif;
  --r:22px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:var(--font); color:var(--berry); background:var(--ground);
  background-image:
    radial-gradient(circle at 8% 12%, #ffd6e8 0 60px, transparent 61px),
    radial-gradient(circle at 92% 30%, #ffe9a8 0 40px, transparent 41px),
    radial-gradient(circle at 85% 85%, #d9f3ff 0 70px, transparent 71px),
    radial-gradient(circle at 10% 80%, #e8dcff 0 50px, transparent 51px);
  background-attachment:fixed;
  min-height:100vh; font-size:17px; line-height:1.4;
  -webkit-tap-highlight-color:transparent;
}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:4px solid var(--lemon);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:14px 60px}
h1,h2,h3{margin:0;line-height:1.1;text-wrap:balance}

/* ---------- top bar ---------- */
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--white);border-radius:28px;padding:10px 14px;box-shadow:0 6px 0 var(--bubble)}
.avatar{width:64px;height:64px;border-radius:50%;object-fit:cover;border:4px solid var(--pink);box-shadow:0 0 0 4px var(--lemon);flex:none;background:var(--blush)}
.hello{flex:1;min-width:150px}
.hello b{font-size:1.6rem;font-weight:800;color:var(--pink-deep);display:block;line-height:1}
.hello span{font-size:.95rem;color:var(--berry-soft)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:999px;font-weight:800;background:var(--blush);white-space:nowrap}
.chip.star{background:var(--lemon);font-size:1.25rem}
.chip.star .n{font-variant-numeric:tabular-nums;min-width:2ch;text-align:right}
.iconbtn{width:46px;height:46px;border-radius:50%;background:var(--blush);font-size:1.4rem;display:grid;place-items:center;flex:none}
.iconbtn:hover{background:var(--bubble)}
.iconbtn.on{background:var(--pink);color:#fff}
.bump{animation:bump .5s}
@keyframes bump{30%{transform:scale(1.35) rotate(-6deg)}}

/* ---------- home ---------- */
.hero{margin-top:18px;display:grid;grid-template-columns:1.2fr 1fr;gap:16px}
@media (max-width:760px){.hero{grid-template-columns:1fr}}
.count{background:linear-gradient(135deg,var(--pink),#ff7ab0);color:#fff;border-radius:var(--r);padding:18px 20px;position:relative;overflow:hidden}
.count .big{font-size:3.4rem;font-weight:800;line-height:.9}
.count .lbl{font-size:1.15rem;font-weight:700}
.count small{display:block;opacity:.9;font-size:.9rem;margin-top:4px}
.tickets{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.ticket{background:rgba(255,255,255,.95);color:var(--berry);border-radius:14px;padding:6px 10px;font-size:.82rem;line-height:1.15;flex:1 1 90px}
.ticket b{display:block;font-size:.95rem;color:var(--pink-deep)}
.ticket.past{opacity:.55}
.ticket.next{box-shadow:0 0 0 3px var(--lemon)}
.mission{background:var(--white);border-radius:var(--r);padding:16px 18px;border:3px dashed var(--bubble)}
.mission h2{font-size:1.3rem;color:var(--pink-deep)}
.mission p{margin:2px 0 10px;color:var(--berry-soft);font-size:.92rem}
.mlist{display:grid;gap:8px}
.mbtn{display:flex;align-items:center;gap:10px;text-align:left;padding:8px 12px;border-radius:14px;background:var(--blush);font-weight:700}
.mbtn:hover{background:var(--bubble)}
.mbtn .tick{margin-left:auto;font-size:1.2rem}
.mbtn.done{background:#dcf8ea}
.level{margin-top:10px;font-size:.9rem;color:var(--berry-soft)}
.bar{height:12px;border-radius:99px;background:var(--blush);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--lemon));border-radius:99px;transition:width .6s}

.day{margin-top:26px}
.dayhead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.dayhead h2{font-size:1.35rem}
.dayhead .when{font-weight:700;color:var(--berry-soft);font-size:.95rem}
.dayhead .tag{font-size:.75rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;background:var(--lemon);border-radius:99px;padding:2px 10px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.tile{--c:var(--pink);position:relative;text-align:left;background:var(--white);border-radius:var(--r);padding:16px;display:grid;gap:6px;box-shadow:0 6px 0 color-mix(in srgb,var(--c) 45%,white);border:3px solid color-mix(in srgb,var(--c) 30%,white);transition:transform .15s}
.tile:hover{transform:translateY(-3px) rotate(-.5deg)}
.tile .ico{width:58px;height:58px;border-radius:18px;background:var(--c);display:grid;place-items:center;font-size:2rem;color:#fff;font-weight:800}
.tile h3{font-size:1.35rem;color:var(--berry)}
.tile .sub{font-size:.85rem;color:var(--berry-soft)}
.tile .prog{display:flex;align-items:center;gap:8px;font-size:.8rem;font-weight:700;color:var(--berry-soft)}
.tile .prog .bar{flex:1;margin:0}
.tile .prog .bar i{background:var(--c)}
.tile .badge{position:absolute;top:10px;right:12px;font-size:1.7rem}

/* ---------- subject ---------- */
.subhead{display:flex;align-items:center;gap:14px;margin-top:18px;flex-wrap:wrap}
.back{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:999px;background:var(--white);font-weight:800;box-shadow:0 4px 0 var(--bubble)}
.back:hover{background:var(--blush)}
.subtitle{display:flex;align-items:center;gap:12px}
.subtitle .ico{width:56px;height:56px;border-radius:16px;background:var(--c);display:grid;place-items:center;font-size:1.9rem;color:#fff;font-weight:800}
.subtitle h1{font-size:2rem}
.subtitle p{margin:0;color:var(--berry-soft);font-size:.95rem}
.section{margin-top:22px}
.section h2{font-size:1.2rem;display:flex;align-items:center;gap:8px;margin-bottom:10px}
.section h2 .pill{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;background:var(--c);color:#fff;padding:3px 10px;border-radius:99px}
.acts{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.act{--c:var(--pink);display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center;text-align:left;background:var(--white);border-radius:18px;padding:12px 14px;border:3px solid color-mix(in srgb,var(--c) 25%,white)}
.act:hover{border-color:var(--c)}
.act .e{grid-row:span 2;font-size:1.9rem;width:48px;height:48px;border-radius:14px;background:color-mix(in srgb,var(--c) 15%,white);display:grid;place-items:center}
.act b{font-size:1.05rem;line-height:1.15}
.act .meta{font-size:.8rem;color:var(--berry-soft);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.act .native{font-size:.95rem;color:var(--berry)}
.act.done{background:color-mix(in srgb,var(--c) 8%,white)}
.stars3{letter-spacing:1px}
.helpbox{margin-top:12px;background:#fffbe6;border:2px solid #ffe58a;border-radius:16px;padding:10px 14px;font-size:.92rem}
.helpbox b{color:#8a5a00}

/* ---------- activity stage ---------- */
.stage{margin-top:16px;background:var(--white);border-radius:28px;padding:18px;box-shadow:0 8px 0 color-mix(in srgb,var(--c) 40%,white);border:3px solid color-mix(in srgb,var(--c) 30%,white)}
.stagehead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.stagehead h2{font-size:1.4rem;flex:1;min-width:180px}
.stagehead .native{display:block;font-size:1rem;color:var(--berry-soft);font-weight:600}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dots i{width:14px;height:14px;border-radius:50%;background:var(--blush)}
.dots i.ok{background:var(--ok)} .dots i.now{background:var(--c);transform:scale(1.25)}
.parent{margin-top:10px;background:#fffbe6;border:2px dashed #ffd34d;border-radius:14px;padding:8px 12px;font-size:.92rem}
.parent::before{content:"For Mummy/Papa: ";font-weight:800;color:#8a5a00}
.q{text-align:center;margin-top:12px}
.q .prompt{font-size:1.35rem;font-weight:700}
.q .bigview{font-size:5rem;line-height:1.1;margin:10px 0;font-weight:800;min-height:1.2em;word-break:break-word}
.q .bigview.txt{font-size:3rem}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-top:12px}
.opt{font-size:2.2rem;font-weight:800;padding:14px 8px;border-radius:20px;background:var(--blush);border:4px solid transparent;min-height:84px;line-height:1.1}
.opt.sm{font-size:1.3rem}
.opt:hover{border-color:var(--c)}
.opt.right{background:#c9f5df;border-color:var(--ok)}
.opt.wrong{background:#ffe0e0;border-color:var(--bad);animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.say{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:999px;background:var(--c);color:#fff;font-weight:800;font-size:1rem}
.say:hover{filter:brightness(1.08)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center;margin-top:14px}
.btn{padding:12px 22px;border-radius:999px;font-weight:800;font-size:1.1rem;background:var(--blush)}
.btn.main{background:var(--pink);color:#fff;box-shadow:0 5px 0 var(--pink-deep)}
.btn.main:active{transform:translateY(3px);box-shadow:0 2px 0 var(--pink-deep)}
.btn:hover{filter:brightness(1.05)}
.btn.small{padding:8px 14px;font-size:.95rem}

/* flashcard */
.card{margin:14px auto 0;max-width:520px;border-radius:28px;background:linear-gradient(160deg,color-mix(in srgb,var(--c) 18%,white),white);border:4px solid color-mix(in srgb,var(--c) 40%,white);padding:18px;text-align:center}
.card .face{font-size:6rem;line-height:1.05;font-weight:800;color:var(--berry)}
.card .face.txt{font-size:2.6rem}
.card .lab{font-size:2rem;font-weight:800;color:var(--c)}
.card .sub{font-size:1.1rem;color:var(--berry-soft)}
.card .tr{margin-top:6px;font-size:1.05rem;background:#fffbe6;border-radius:12px;padding:4px 10px;display:inline-block}
.card .ans{margin-top:10px;font-size:1.6rem;font-weight:800;color:var(--pink-deep)}
.strip{display:flex;gap:6px;overflow-x:auto;padding:8px 2px;margin-top:10px;scrollbar-width:thin}
.strip button{flex:none;min-width:44px;height:44px;border-radius:12px;background:var(--blush);font-weight:800;font-size:1.2rem;padding:0 8px}
.strip button.cur{background:var(--c);color:#fff}
.strip button.known{box-shadow:inset 0 -4px 0 var(--lemon)}

/* match */
.match{display:grid;grid-template-columns:1fr 1fr;gap:12px 28px;margin-top:14px;max-width:620px;margin-inline:auto}
.match .col{display:grid;gap:10px}
.mi{font-size:2rem;font-weight:800;padding:10px;border-radius:18px;background:var(--blush);border:4px solid transparent;min-height:70px}
.mi.sm{font-size:1.25rem}
.mi.sel{border-color:var(--c);background:color-mix(in srgb,var(--c) 18%,white)}
.mi.ok{background:#c9f5df;border-color:var(--ok);cursor:default}
.mi.wrong{animation:shake .4s;border-color:var(--bad)}

/* order */
.slots{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px;min-height:84px}
.slot{min-width:74px;height:74px;border-radius:18px;border:4px dashed var(--bubble);display:grid;place-items:center;font-size:2rem;font-weight:800;padding:0 8px}
.slot.fill{border-style:solid;border-color:var(--ok);background:#c9f5df}
.pool{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.tilebtn{min-width:74px;height:74px;border-radius:18px;background:var(--blush);font-size:2rem;font-weight:800;padding:0 10px;border:4px solid transparent}
.tilebtn.used{visibility:hidden}
.tilebtn.wrong{animation:shake .4s;border-color:var(--bad)}
.seq .tilebtn,.seq .slot{font-size:1.05rem;height:auto;min-height:74px;padding:8px 12px;max-width:260px;text-align:center;line-height:1.2}
.seq .slots{flex-direction:column;align-items:center}

/* find */
.target{display:inline-grid;place-items:center;min-width:96px;padding:0 18px;height:96px;border-radius:24px;background:var(--lemon);font-size:3.4rem;font-weight:800;margin-top:6px}
.findrow{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:16px}
.fb{width:72px;height:72px;border-radius:50%;background:var(--blush);font-size:2.1rem;font-weight:800;border:4px solid transparent}
.fb.ok{border-color:var(--ok);background:#c9f5df;box-shadow:0 0 0 4px #fff,0 0 0 7px var(--ok)}
.fb.wrong{animation:shake .4s;border-color:var(--bad)}

/* trace & draw */
.tracewrap{margin:12px auto 0;max-width:560px}
canvas.pad{width:100%;aspect-ratio:1/1;max-width:100%;border-radius:24px;background:
  repeating-linear-gradient(0deg,transparent 0 24%,#ffd6e8 24% calc(24% + 2px)),#fff;border:4px solid var(--bubble);touch-action:none;display:block}
canvas.drawpad{aspect-ratio:4/3;background:#fff}
.palette{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:10px}
.palette button{width:40px;height:40px;border-radius:50%;border:4px solid #fff;box-shadow:0 0 0 2px var(--bubble)}
.palette button.cur{box-shadow:0 0 0 4px var(--berry)}

/* rhyme */
.rhyme{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px;margin-top:14px;align-items:start}
@media (max-width:760px){.rhyme{grid-template-columns:1fr}}
.rhyme img{width:100%;border-radius:20px;border:4px solid var(--bubble);display:block}
.missing{border:4px dashed var(--bubble);border-radius:20px;padding:30px 18px;text-align:center;background:var(--blush)}
.missing .e{font-size:4rem}
.rate{display:flex;gap:8px;margin-top:8px}
.rate button{font-size:2.4rem;filter:grayscale(1) opacity(.45);transition:transform .15s}
.rate button.on{filter:none}
.rate button:hover{transform:scale(1.15)}
.words{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.98rem;margin-top:6px}
.words .kn{font-size:1.15rem;font-weight:700}
.lines{margin-top:6px;display:grid;gap:6px}
.lines div{background:var(--blush);border-radius:12px;padding:6px 10px}
.lines .kn{font-size:1.2rem;font-weight:700;display:block}

/* chart */
.chart{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin-top:12px}
.chart button{aspect-ratio:1;border-radius:10px;background:var(--blush);font-weight:800;font-size:clamp(.8rem,2.6vw,1.2rem);font-variant-numeric:tabular-nums}
.chart button:nth-child(10n){background:#ffe9a8}
.chart button.hit{background:var(--c);color:#fff}

/* gk */
.gkans input{font:inherit;font-size:1.2rem;padding:8px 12px;border-radius:12px;border:3px solid var(--bubble);width:100%;max-width:360px}

/* finish */
.finish{text-align:center;padding:20px 0}
.finish .trophy{font-size:6rem;animation:pop .8s}
@keyframes pop{0%{transform:scale(0) rotate(-30deg)}70%{transform:scale(1.2) rotate(8deg)}}
.finish h2{font-size:2rem;color:var(--pink-deep)}

/* stickers & settings modal */
.modal{position:fixed;inset:0;background:rgba(79,13,51,.45);display:grid;place-items:center;padding:16px;z-index:50}
.sheet{background:var(--white);border-radius:28px;padding:20px;max-width:640px;width:100%;max-height:88vh;overflow:auto}
.sheet h2{color:var(--pink-deep);font-size:1.6rem}
.stickers{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:10px;margin-top:12px}
.stk{aspect-ratio:1;border-radius:18px;background:var(--blush);display:grid;place-items:center;font-size:2.2rem}
.stk.lock{filter:grayscale(1);opacity:.3;font-size:1.4rem}
.field{display:grid;gap:4px;margin-top:12px}
.field label{font-weight:800}
.field input{font:inherit;padding:8px 12px;border-radius:12px;border:3px solid var(--bubble)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--berry);color:#fff;padding:10px 18px;border-radius:999px;font-weight:700;z-index:60;max-width:calc(100% - 32px);text-align:center}
#fx{position:fixed;inset:0;pointer-events:none;z-index:70}
.kn{font-family:"Baloo Tamma 2",var(--font)}
small.p{display:block;font-size:.85rem;font-weight:600;color:var(--berry-soft);margin-top:2px}
body.nohelp .p,body.nohelp .parent{display:none!important}

/* rhyme cues, word helper, story */
.cues{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:8px}
.cue{position:relative;background:color-mix(in srgb,var(--c) 10%,white);border:3px solid color-mix(in srgb,var(--c) 30%,white);border-radius:18px;padding:12px 10px 10px;text-align:center;display:grid;gap:2px;font-weight:700;line-height:1.2}
.cue .ce{font-size:2.6rem;line-height:1.1}
.cue .cn{position:absolute;top:6px;left:8px;width:24px;height:24px;border-radius:50%;background:var(--c);color:#fff;font-size:.8rem;display:grid;place-items:center}
.wordgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:8px}
.wordbtn{display:grid;gap:0;text-align:left;background:#fffbe6;border:2px solid #ffe58a;border-radius:14px;padding:8px 10px}
.wordbtn .kn{font-size:1.35rem;font-weight:700}
.wordbtn small{color:var(--berry-soft)}
.wordbtn:hover{border-color:var(--c)}
textarea{width:100%;font:inherit;font-size:1.1rem;line-height:1.6;padding:10px 14px;border-radius:16px;border:3px solid var(--bubble);background:var(--white);color:var(--berry);resize:vertical}
.story{display:grid;gap:10px;margin-top:12px}
.scene{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;background:color-mix(in srgb,var(--c) 8%,white);border-radius:18px;padding:10px 14px}
.scene .se{font-size:2.4rem;text-align:center}
.scene p{margin:0;font-size:1.2rem;font-weight:600}
.say.small{padding:6px 12px}
.moral{margin-top:14px;background:var(--lemon);border-radius:18px;padding:12px 16px;font-size:1.25rem;font-weight:700}
.chart button:hover{outline:3px solid var(--c)}

/* welcome, cheering, voice controls */
.splash{min-height:80vh;display:grid;place-content:center;justify-items:center;text-align:center;gap:10px}
.splash img{width:min(220px,55vw);aspect-ratio:1;border-radius:50%;object-fit:cover;border:8px solid var(--pink);box-shadow:0 0 0 8px var(--lemon),0 14px 0 8px var(--bubble);animation:pop .8s}
.splash h1{font-size:clamp(2rem,7vw,3.2rem);color:var(--pink-deep);margin-top:18px}
.splash p{margin:0;font-size:1.3rem;color:var(--berry-soft)}
.btn.big{font-size:1.6rem;padding:16px 40px;margin-top:10px}
.cheer{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:80;display:flex;align-items:center;gap:10px;background:var(--white);border:4px solid var(--pink);border-radius:999px;padding:6px 18px 6px 6px;box-shadow:0 8px 24px rgba(216,27,106,.25);font-size:1.25rem;font-weight:800;color:var(--pink-deep);animation:cheer .35s ease-out;max-width:calc(100% - 32px)}
.cheer img{width:48px;height:48px;border-radius:50%;object-fit:cover}
.cheer b{font-size:1.6rem}
@keyframes cheer{from{transform:translate(-50%,-30px) scale(.8);opacity:0}}
.say.big{width:64px;height:64px;padding:0;justify-content:center;font-size:1.8rem;border-radius:50%;box-shadow:0 5px 0 color-mix(in srgb,var(--c) 60%,black)}
.hint{margin:6px 0 0;color:var(--berry-soft);font-weight:700}

// options = answer + (n-1) distinct distractors, shuffled; returns {opts, ans}
function choices(answer, pool, n = 4, key = x => x) {
  const others = shuffle(pool.filter(p => key(p) !== key(answer))).slice(0, n - 1);
  const opts = shuffle([answer, ...others]);
  return { opts, ans: opts.findIndex(o => key(o) === key(answer)) };
}

<script>
// ================= state =================
const KEY = "krishvi-star-garden-v1";
const DEFAULT = { stars: 0, done: {}, known: {}, rated: {}, words: {}, stickers: [], founder: "", teacher: "", help: true, mission: null };
let S;
try { S = Object.assign({}, DEFAULT, JSON.parse(localStorage.getItem(KEY) || "{}")); } catch { S = { ...DEFAULT }; }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} };

const app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const ALL_ACTS = SUBJECTS.flatMap(s => s.acts.map(a => ({ ...a, subj: s })));
const findAct = id => ALL_ACTS.find(a => a.id === id);
const subjOf = id => SUBJECTS.find(s => s.id === id);
const LEVELS = [[0, "Little Seed", "🌱"], [25, "Sprout", "🌿"], [75, "Bud", "🌷"], [150, "Blossom", "🌸"], [300, "Rainbow Garden", "🌈"], [500, "Star Princess", "👑"]];
const L = DATA.lines;
const sleep = ms => new Promise(r => setTimeout(r, ms));
document.body.classList.toggle("nohelp", !S.help);

// ================= voice =================
// Every fixed sentence is a pre-recorded clip listed in audio/manifest.js.
// Anything not recorded (typed rhyme words, names) is read by the same voices live.
const CLIPS = window.AUDIO || {};
const VOICE = { en: "Samantha", hi: "Lekha", kn: "Soumya" };
let token = 0, curAudio = null, curDone = null;
function stopVoice() {
  token++;
  if (curAudio) { curAudio.pause(); curAudio = null; }
  if (curDone) { curDone(); curDone = null; }
  if ("speechSynthesis" in window) speechSynthesis.cancel();
}
function playFile(f) {
  return new Promise(res => {
    const a = new Audio("audio/" + f); curAudio = a; curDone = res;
    a.onended = a.onerror = () => { curDone = null; res(); };
    a.play().catch(() => { curDone = null; res(); });
  });
}
function liveSay(text, lang) {
  return new Promise(res => {
    if (!("speechSynthesis" in window)) return res();
    const vs = speechSynthesis.getVoices();
    const u = new SpeechSynthesisUtterance(text);
    const v = vs.find(x => x.name.startsWith(VOICE[lang])) || vs.find(x => x.lang.replace("_", "-").startsWith(lang));
    if (v) { u.voice = v; u.lang = v.lang; }
    u.rate = .9; curDone = res;
    const t = setTimeout(res, 4000 + text.length * 120);
    u.onend = u.onerror = () => { clearTimeout(t); curDone = null; res(); };
    setTimeout(() => speechSynthesis.speak(u), 60);
  });
}
function segToLive(seg) {
  const [p, rest] = seg.includes("|") ? [seg.slice(0, seg.indexOf("|")), seg.slice(seg.indexOf("|") + 1)] : ["", seg];
  if (p === "kn") return [rest, "kn"];
  if (p === "hi") return [rest, "hi"];
  if (p === "L") return [DATA.letterNames[rest] || rest, "en"];
  if (p === "ph") return [DATA.phon[rest] || rest, "en"];
  return [seg, "en"];
}
// say(["What comes after", "L|C"]) plays the clips one after another. A newer call stops an older one.
async function say(segs) {
  stopVoice(); const my = token;
  for (const seg of [].concat(segs || [])) {
    if (my !== token) return false;
    if (seg === "?" || seg === "") continue;
    if (seg === "_") { await sleep(300); continue; }
    if (seg === "__") { await sleep(1200); continue; }
    if (CLIPS[seg]) await playFile(CLIPS[seg]);
    else { const [t, l] = segToLive(seg); await liveSay(t, l); }
  }
  return my === token;
}
if ("speechSynthesis" in window) speechSynthesis.getVoices();

// Pinky, the cartoon cheerleader who cheers for Krishvi
const MASCOT = `<svg class="mascot" viewBox="0 0 140 160" aria-label="cheering girl">
  <g class="arm l"><path d="M52 92 L28 58" stroke="#ffcfa8" stroke-width="9" stroke-linecap="round"/><g fill="#ff3e8a"><circle cx="24" cy="50" r="13"/><circle cx="14" cy="44" r="7"/><circle cx="32" cy="38" r="7"/><circle cx="16" cy="58" r="6"/></g></g>
  <g class="arm r"><path d="M88 92 L112 58" stroke="#ffcfa8" stroke-width="9" stroke-linecap="round"/><g fill="#ffd23f"><circle cx="116" cy="50" r="13"/><circle cx="126" cy="44" r="7"/><circle cx="108" cy="38" r="7"/><circle cx="124" cy="58" r="6"/></g></g>

  <circle cx="34" cy="40" r="0"/>

    <path d="M38 30 l8 -6 l2 10 z M102 30 l-8 -6 l-2 10 z" fill="#ff3e8a"/></g>

  <circle cx="51" cy="64" r="5" fill="#ff9fc3" opacity=".8"/><circle cx="89" cy="64" r="5" fill="#ff9fc3" opacity=".8"/>
  <path d="M60 66 Q70 78 80 66 Z" fill="#c2185b"/><path d="M64 70 Q70 74 76 70" stroke="#ff9fc3" stroke-width="2" fill="none"/>
</svg>`;

// ================= sounds, fx, praise =================
let actx;
function tone(notes, type = "sine", dur = .14) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    notes.forEach((f, i) => {
      const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime + i * dur;
      o.type = type; o.frequency.value = f; g.gain.setValueAtTime(.0001, t);
      g.gain.exponentialRampToValueAtTime(.12, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + dur * 1.6);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur * 1.8);
    });
  } catch {}
}
const sGood = () => tone([660, 880, 1175], "triangle", .08);
const sBad = () => tone([300, 220], "sine", .14);
const sWin = () => tone([523, 659, 784, 1047, 784, 1047], "triangle", .11);

function toast(msg) {
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t);
  setTimeout(() => t.remove(), 3200);
}
let bubbleT;
function bubble(text, emoji = "🌟") {
  document.querySelector(".cheer")?.remove(); clearTimeout(bubbleT);
  const b = document.createElement("div"); b.className = "cheer";
  b.innerHTML = `${MASCOT}<span>${esc(text)}</span><b>${emoji}</b>`;
  document.body.appendChild(b); bubbleT = setTimeout(() => b.remove(), 2400);
}
// praise out loud + on screen; returns when the voice is done
function praise(list = L.praise, before = []) {
  const line = pick(list); bubble(line, pick(["🌟", "💖", "🎉", "👏", "🌸", "✨"]));
  return say([...before, "_", line]);
}

const fx = document.getElementById("fx"), fctx = fx.getContext("2d");
let parts = [];
function confetti(n = 60) {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  fx.width = innerWidth; fx.height = innerHeight;
  const em = ["💖", "⭐", "🌸", "✨", "🎀", "💗"];
  const start = !parts.length;
  for (let i = 0; i < n; i++) parts.push({ x: innerWidth / 2 + (Math.random() - .5) * 200, y: innerHeight * .45, vx: (Math.random() - .5) * 14, vy: -Math.random() * 14 - 4, e: pick(em), s: 18 + rnd(18), life: 90 });
  if (start) requestAnimationFrame(step);
}
function step() {
  fctx.clearRect(0, 0, fx.width, fx.height);
  parts.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += .45; p.life--; fctx.font = p.s + "px serif"; fctx.fillText(p.e, p.x, p.y); });
  parts = parts.filter(p => p.life > 0 && p.y < fx.height + 40);
  if (parts.length) requestAnimationFrame(step); else fctx.clearRect(0, 0, fx.width, fx.height);
}

function addStars(n) {
  if (n <= 0) return;
  const before = level().name;
  S.stars += n; save();
  const el = document.querySelector(".chip.star .n");
  if (el) { el.textContent = S.stars; const c = el.parentElement; c.classList.remove("bump"); void c.offsetWidth; c.classList.add("bump"); }
  if (level().name !== before) setTimeout(() => { sWin(); confetti(90); bubble(`${level().icon} ${level().name}!`, "🎉"); say([L.level]); }, 2600);
}
function level() {
  let Lv = LEVELS[0], next = null;
  for (let i = 0; i < LEVELS.length; i++) if (S.stars >= LEVELS[i][0]) { Lv = LEVELS[i]; next = LEVELS[i + 1] || null; }
  return { name: Lv[1], icon: Lv[2], from: Lv[0], next };
}

// ================= dates & mission =================
const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };
const dayDiff = ds => Math.round((new Date(ds + "T00:00:00") - new Date(todayStr() + "T00:00:00")) / 864e5);
const nextExam = () => DATA.exams.find(e => dayDiff(e.date) >= 0);
const fmtDate = ds => new Date(ds + "T00:00:00").toLocaleDateString("en-IN", { day: "numeric", month: "short" });
function mission() {
  const t = todayStr();
  if (S.mission && S.mission.date === t && S.mission.ids.every(findAct)) return S.mission;
  const ne = nextExam() || DATA.exams[0];
  const pool = [...ne.subjects.flatMap(id => subjOf(id).acts), ...ALL_ACTS].filter((a, i, arr) => arr.findIndex(b => b.id === a.id) === i);
  const fresh = pool.filter(a => !S.done[a.id]);
  S.mission = { date: t, ids: sample((fresh.length >= 3 ? fresh : pool).slice(0, 12), 3).map(a => a.id), bonus: false, finished: {} }; save();
  return S.mission;
}
function missionCheck() {
  const m = S.mission; if (!m || m.bonus || !m.ids.every(id => m.finished[id])) return false;
  m.bonus = true; S.stars += 5; save(); return true;
}

  const Lv = level();

// ================= count along: numbers light up as the voice counts =================
function runChant(a) {
  const nums = a.nums; let busy = false;
  dots(0, 0, []);
  body().innerHTML = `<div class="q">
    <div class="chantrow">${nums.map((n, k) => `<span class="cb" data-c="${k}">${n}</span>`).join("")}</div>
    <div class="row"><button class="btn main" id="cGo">▶ Count with me</button><button class="btn main alt" id="cHide">🙈 Hide the numbers</button></div>
    <p class="hint" id="cHint">Listen, then she counts out loud 🗣️</p>
    <div class="row"><button class="btn main" id="cSaid">⭐ She said it!</button></div></div>`;
  const b = body(), boxes = [...b.querySelectorAll(".cb")];
  async function count(first) {
    if (busy) return; busy = true;
    boxes.forEach(x => x.classList.remove("lit"));
    if (!(await say(first ? withStart(a.ask) : a.ask))) { busy = false; return; }
    const my = token;
    for (let k = 0; k < nums.length; k++) {
      if (my !== token) { busy = false; return; }
      boxes[k].classList.add("lit"); boxes[k].classList.remove("hid");
      if (CLIPS[N(nums[k])]) await playFile(CLIPS[N(nums[k])]); else await liveSay(N(nums[k]), "en");
      await sleep(250);
    }
    busy = false;
    if (my === token) { bubble(L.yourTurn, "🎤"); say([L.yourTurn]); }
  }
  b.querySelector("#cGo").onclick = () => count(false);
  b.querySelector("#cHide").onclick = () => { boxes.forEach(x => { x.classList.remove("lit"); x.classList.add("hid"); }); say(["Now you say it!"]); };
  b.querySelector("#cSaid").onclick = async () => {
    b.querySelector("#cSaid").disabled = true; sGood(); addStars(3);
    await praise(L.praise); finish(a, 3, true);
  };
  count(true);
}

// ================= cards: listen and repeat =================
function runCards(a) {
  const deck = a.deck();
  const known = new Set(S.known[a.id] || []);
  let i = 0, stars = 0;
  const kn = a.subj.id === "kannada";
  function draw() {
    const c = deck[i];
    dots(0, 0, []);
    body().innerHTML = `
      <div class="card">
        ${c.pic ? `<div class="duo"><div class="face ${c.faceCls || ""}">${c.face}</div><div class="cardpic">${c.pic}</div></div>` : `<div class="face ${c.faceCls || ""}">${c.face}</div>`}
        ${c.lab ? `<div class="lab">${c.lab}</div>` : ""}
        ${c.sub ? `<div class="sub">${c.sub}</div>` : ""}
        ${c.tr ? `<div class="tr p">${c.tr}</div>` : ""}
        <div class="row"><button class="btn" id="bPrev" ${i === 0 ? "disabled" : ""} aria-label="Previous">◀</button>${replayBtn}<button class="btn" id="bNext" aria-label="Next">▶</button></div>
        ${c.yt ? `<div class="row"><a class="btn small yt" href="https://www.youtube.com/results?search_query=${encodeURIComponent(c.yt)}" target="_blank" rel="noopener">▶ Watch the “${c.face}” song on YouTube</a></div>` : ""}
        <div class="row"><button class="btn main" id="bKnow">${known.has(i) ? "✅ She said it" : "⭐ She said it!"}</button></div>
      </div>
      <div class="strip">${deck.map((d, k) => `<button class="${k === i ? "cur" : ""} ${known.has(k) ? "known" : ""} ${kn ? "kn" : ""}" data-k="${k}">${typeof d.face === "number" || String(d.face).length < 4 ? d.face : k + 1}</button>`).join("")}</div>
      <p style="text-align:center;color:var(--berry-soft);margin:8px 0 0">${known.size} of ${deck.length} done</p>`;
    const b = body();
    b.querySelector("[data-replay]").onclick = () => say(c.say);
    b.querySelector("#bPrev").onclick = () => { i--; draw(); };
    b.querySelector("#bNext").onclick = () => { i = (i + 1) % deck.length; draw(); };
    b.querySelector("#bKnow").onclick = async () => {
      if (!known.has(i)) { known.add(i); S.known[a.id] = [...known]; addStars(1); stars++; sGood(); save(); }
      if (known.size === deck.length) { await praise(L.saidIt); return finish(a, stars, false); }
      const ok = await praise(L.saidIt);
      if (ok && document.body.contains(b)) { i = (i + 1) % deck.length; while (known.has(i) && known.size < deck.length) i = (i + 1) % deck.length; draw(); }
    };
    b.querySelectorAll("[data-k]").forEach(x => x.onclick = () => { i = +x.dataset.k; draw(); });
    b.querySelector(".strip .cur")?.scrollIntoView({ block: "nearest", inline: "center" });
    say(withStart(c.say));
  }
  draw();
}

// ================= say it: asked out loud, she answers out loud =================
const fillName = t => t.replace("{founder}", S.founder || "").replace("{teacher}", S.teacher || "");
function runSayIt(a) {
  const items = a.items();
  let i = 0, stars = 0; const ok = [];
  function draw() {
    const it = items[i];
    const ans = it.editable ? fillName(it.ans) : it.ans;
    const ansSay = it.editable ? [ans] : it.ansSay;
    const missing = it.editable && !S[it.editable];
    dots(items.length, i, ok);
    body().innerHTML = `<div class="q">
      <div class="bigview" id="sBig">${it.reveal ? `<button class="mystery" id="bPeek" aria-label="Tap to see the picture"><span>👀</span><b>Tap to see</b></button>` : it.big}</div>
      ${it.sub ? small(it.sub) : ""}
      <div class="row">${replayBtn}</div>
      <p class="hint">She answers out loud 🗣️</p>
      <div class="ansbox" id="ans" hidden>${ans}</div>
      ${missing ? `<p class="p">Type the ${it.editable === "founder" ? "founder's" : "teacher's"} name in ⚙️ Settings so this answer shows here.</p>` : ""}
      <div class="row"><button class="btn" id="bHear">👂 Hear the answer</button><button class="btn main" id="bSaid">⭐ She said it!</button></div>
      <div class="row"><button class="btn small" id="bSkip">Skip ▶</button></div></div>`;
    const b = body();
    b.querySelector("[data-replay]").onclick = () => say(it.ask);
    const show = () => { b.querySelector("#ans").hidden = false; if (it.reveal && b.querySelector("#bPeek")) { b.querySelector("#sBig").innerHTML = `<span class="popin">${it.reveal}</span>`; } };
    b.querySelector("#bPeek")?.addEventListener("click", () => { show(); if (!missing) say(ansSay); });
    b.querySelector("#bHear").onclick = () => { show(); if (!missing) say(ansSay); };
    const next = () => { i++; i < items.length ? draw() : finish(a, stars, true); };
    b.querySelector("#bSkip").onclick = next;
    b.querySelector("#bSaid").onclick = async () => {
      show(); b.querySelector("#bSaid").disabled = true;
      sGood(); addStars(1); stars++; ok[i] = 1; dots(items.length, i, ok);
      const done = await praise(L.praise, missing ? [] : ansSay);
      if (done && document.body.contains(b)) next();
    };
    say(withStart(it.ask));
  }
  draw();
}

// ================= quiz: tap the right one =================
function runQuiz(a) {
  const NQ = 8, qs = [], keys = new Set();
  for (let t = 0; qs.length < NQ && t < 300; t++) { const q = a.gen(); const k = JSON.stringify(q.key); if (!keys.has(k)) { keys.add(k); qs.push(q); } }
  let i = 0, stars = 0; const ok = [];
  function draw() {
    const q = qs[i]; let tries = 0;
    dots(qs.length, i, ok);
    body().innerHTML = `<div class="q">
      <div class="bigview ${q.bigCls || ""}">${q.big}</div>
      ${q.sub ? small(q.sub) : ""}
      <div class="row">${replayBtn}</div>
      <div class="opts ${q.wide ? "wide" : ""}">${q.opts.map((o, k) => `<button class="opt" data-o="${k}">${o}</button>`).join("")}</div></div>`;
    const b = body();
    b.querySelector("[data-replay]").onclick = () => say(q.ask);
    b.querySelectorAll("[data-o]").forEach(btn => btn.onclick = async () => {
      const k = +btn.dataset.o;
      if (k === q.ans) {
        btn.classList.add("right"); sGood();
        b.querySelectorAll("[data-o]").forEach(x => x.disabled = true);
        const hole = b.querySelector(".nb.blank");
        if (hole && q.fill !== undefined) { hole.textContent = q.fill; hole.classList.add("filled"); }
        if (tries === 0) { stars++; addStars(1); ok[i] = 1; dots(qs.length, i, ok); }
        const done = await praise(L.praise, q.after || []);
        if (done && document.body.contains(b)) { i++; i < qs.length ? draw() : finish(a, stars, true); }
      } else { tries++; btn.classList.add("wrong"); btn.disabled = true; sBad(); say([pick(L.tryAgain)]); }
    });
    say(withStart(q.ask));
  }
  draw();
}

// ================= match pairs =================
function runMatch(a) {
  const pairs = a.pairs();
  const right = shuffle(pairs.map((p, k) => k));
  let sel = null, matched = 0, stars = 0;
  dots(0, 0, []);
  body().innerHTML = `<div class="row">${replayBtn}</div>
    <div class="match"><div class="col">${pairs.map((p, k) => `<button class="mi" data-l="${k}">${p.l}</button>`).join("")}</div>
    <div class="col">${right.map(k => `<button class="mi" data-r="${k}">${pairs[k].r}</button>`).join("")}</div></div>`;

// ================= put in order =================
function runOrder(a) {

  const rounds = [first]; for (let t = 0; rounds.length < R && t < 50; t++) { const r = a.gen(); if (!rounds.some(x => JSON.stringify(x.key) === JSON.stringify(r.key))) rounds.push(r); }
  let ri = 0, stars = 0; const ok = [];
  function draw() {
    const r = rounds[ri]; let next = 0, miss = 0;
    dots(R > 1 ? R : 0, ri, ok);
    const pool = shuffle(r.items.map((v, k) => ({ v, k })));
    body().innerHTML = `<div class="q ${r.cap ? "seq" : ""}">
      ${r.big ? `<div class="bigview">${r.big}</div>` : ""}
      <div class="row">${replayBtn}</div>
      <div class="slots">${r.items.map((_, k) => `<div class="slot" data-s="${k}">${r.cap ? `<span class="sn">${k + 1}</span>` : ""}</div>`).join("")}</div>
      <div class="pool">${pool.map(p => `<button class="tilebtn" data-k="${p.k}">${p.v}${r.cap ? small(r.cap[p.k]) : ""}</button>`).join("")}</div></div>`;

        x.classList.add("used"); sGood(); next++;
        if (next === r.items.length) {
          const won = miss === 0 ? 2 : 1; stars += won; addStars(won); ok[ri] = 1;
          const done = await praise(L.praise, r.done || []);
          if (done && document.body.contains(b)) { ri++; ri < rounds.length ? draw() : finish(a, stars, true); }
        } else if (r.itemSay) say(r.itemSay(r.items[next - 1]));

}

// ================= tracing board =================
function runTrace(a) {
  const chars = a.chars, done = new Set(S.known[a.id] || []);
  const goal = Math.min(chars.length, 10);
  let i = 0, stars = 0;
  const fam = a.font === "kn" ? '"Baloo Tamma 2"' : /[ऀ-ॿ]/.test(chars[0]) ? '"Baloo 2"' : '"Andika"';
  dots(0, 0, []);
  body().innerHTML = `<div class="tracewrap">
    <canvas class="pad" id="pad"></canvas>
    <div class="row">
      <button class="btn" id="tPrev" aria-label="Previous">◀</button>
      <button class="btn" id="tClear">🧽 Clear</button>
      ${replayBtn}
      <button class="btn" id="tNext" aria-label="Next">▶</button>
    </div>
    <div class="row"><button class="btn main" id="tDone">⭐ I wrote it!</button></div>
    <div class="strip" id="tStrip"></div>
    <p class="p" style="text-align:center;margin:6px 0 0">Trace with a finger here, then write it in her notebook too. After ${goal} she wins a sticker.</p>
  </div>`;
  const cv = document.getElementById("pad"), ctx = cv.getContext("2d");
  let drawing = false, last = null;
  function size() { const r = cv.getBoundingClientRect(), d = devicePixelRatio || 1; cv.width = r.width * d; cv.height = r.height * d; ctx.setTransform(d, 0, 0, d, 0, 0); }
  function guide(talk) {
    const r = cv.getBoundingClientRect(), w = r.width, h = r.height, ch = chars[i];
    ctx.clearRect(0, 0, w, h);
    const fs = Math.min(h * .72, (w * .9) / Math.max(1, ch.length * .62));
    ctx.font = `700 ${fs}px ${fam}, sans-serif`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillStyle = "#ffd6e8"; ctx.fillText(ch, w / 2, h / 2 + fs * .04);
    ctx.setLineDash([6, 8]); ctx.lineWidth = 3; ctx.strokeStyle = "#ff3e8a"; ctx.strokeText(ch, w / 2, h / 2 + fs * .04); ctx.setLineDash([]);
    const st = document.getElementById("tStrip");
    st.innerHTML = chars.map((c, k) => `<button class="${k === i ? "cur" : ""} ${done.has(k) ? "known" : ""} ${a.font === "kn" ? "kn" : ""}" data-k="${k}">${c}</button>`).join("");
    st.querySelectorAll("[data-k]").forEach(x => x.onclick = () => { i = +x.dataset.k; guide(true); });
    st.querySelector(".cur")?.scrollIntoView({ block: "nearest", inline: "center" });
    document.getElementById("tDone").textContent = done.has(i) ? "✅ Written! Next ▶" : "⭐ I wrote it!";
    if (talk) say(talk === "start" ? withStart(["Trace it with your finger.", "_", ...a.say(ch)]) : a.say(ch));
  }
  const pos = e => { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  cv.onpointerdown = e => { drawing = true; last = pos(e); cv.setPointerCapture(e.pointerId); };
  cv.onpointermove = e => { if (!drawing) return; const p = pos(e); ctx.strokeStyle = "#a0005a"; ctx.lineWidth = 10; ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.beginPath(); ctx.moveTo(...last); ctx.lineTo(...p); ctx.stroke(); last = p; };
  cv.onpointerup = cv.onpointercancel = () => drawing = false;
  document.getElementById("tPrev").onclick = () => { i = (i - 1 + chars.length) % chars.length; guide(true); };
  document.getElementById("tNext").onclick = () => { i = (i + 1) % chars.length; guide(true); };
  document.getElementById("tClear").onclick = () => guide(false);
  body().querySelector("[data-replay]").onclick = () => say(a.say(chars[i]));
  document.getElementById("tDone").onclick = async () => {
    if (!done.has(i)) {
      done.add(i); S.known[a.id] = [...done]; addStars(1); stars++; sGood(); save();
      if (done.size === goal && !S.done[a.id]) { await praise(L.write); finish(a, stars, true); return; }
      const ok = await praise(L.write); if (!ok || !document.body.contains(cv)) return;
    }
    i = (i + 1) % chars.length; guide(true);
  };
  const go = talk => { if (!document.body.contains(cv)) return; size(); guide(talk); };
  (document.fonts ? document.fonts.load(`700 40px ${fam}`, chars[0]).catch(() => {}) : Promise.resolve()).then(() => go("start"));
  addEventListener("resize", () => { if (document.getElementById("pad") === cv) go(false); });
}

function rateBlock(id, label) {
  const r = S.rated[id] || 0;

}
function wireRate(a, id, lines) {

    body().querySelectorAll("[data-rate]").forEach(y => y.classList.toggle("on", +y.dataset.rate <= n));

// recordings of a grown-up singing, kept in this browser
const recStore = (() => {
  let dbp;
  const open = () => dbp || (dbp = new Promise((res, rej) => { const r = indexedDB.open("krishvi-recordings", 1); r.onupgradeneeded = () => r.result.createObjectStore("rec"); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }));
  const tx = async (mode, fn) => { try { const db = await open(); return await new Promise(res => { const t = db.transaction("rec", mode); const q = fn(t.objectStore("rec")); t.oncomplete = () => res(q && q.result); t.onerror = () => res(null); }); } catch { return null; } };
  return { get: k => tx("readonly", st => st.get(k)), set: (k, v) => tx("readwrite", st => st.put(v, k)), del: k => tx("readwrite", st => st.delete(k)) };
})();
function playBlob(blob) {
  return new Promise(res => {
    const url = URL.createObjectURL(blob), a = new Audio(url); curAudio = a; curDone = res;
    a.onended = a.onerror = () => { URL.revokeObjectURL(url); curDone = null; res(); };
    a.play().catch(() => { curDone = null; res(); });
  });
}

  say(withStart(promptSay(prompt)));
}

// ================= sticker book & settings =================
function modal(html) {
  const m = document.createElement("div"); m.className = "modal"; m.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">${html}<div class="row"><button class="btn main" data-close>Close</button></div></div>`;
  m.onclick = e => { if (e.target === m || e.target.hasAttribute("data-close")) m.remove(); };
  document.body.appendChild(m); return m;
}
function stickerBook() {
  modal(`<h2>Krishvi's Sticker Book</h2><p>Finish a game for the first time to win a sticker. ${ALL_ACTS.filter(a => S.done[a.id]).length} of ${ALL_ACTS.length} collected.</p>
    <div class="stickers">${ALL_ACTS.map((a, k) => S.done[a.id] ? `<div class="stk" title="${esc(a.t)}">${DATA.stickers[k % DATA.stickers.length]}</div>` : `<div class="stk lock" title="${esc(a.t)}">?</div>`).join("")}</div>`);
}
function settings() {
  const m = modal(`<h2>For grown-ups</h2>
    <div class="field"><label for="sFounder">Founder of Blooming Buds (GK answer)</label><input id="sFounder" value="${esc(S.founder)}" placeholder="Type the name"></div>
    <div class="field"><label for="sTeacher">Class teacher's name (My School)</label><input id="sTeacher" value="${esc(S.teacher)}" placeholder="Type the name"></div>
    <p style="font-size:.92rem;color:var(--berry-soft)">Stars, stickers and typed rhyme words are saved in this browser on this device only.</p>
    <div class="row" style="justify-content:flex-start"><button class="btn small" id="sReset">Start over (clear stars)</button></div>
    <div id="sConfirm" hidden class="helpbox">This clears all stars, stickers and progress. Typed rhyme words and names are kept.
      <div class="row" style="justify-content:flex-start"><button class="btn small main" id="sYes">Yes, start over</button><button class="btn small" id="sNo">Keep everything</button></div></div>`);
  m.querySelector("#sFounder").onchange = e => { S.founder = e.target.value.trim(); save(); toast("Saved"); };
  m.querySelector("#sTeacher").onchange = e => { S.teacher = e.target.value.trim(); save(); toast("Saved"); };
  m.querySelector("#sReset").onclick = () => m.querySelector("#sConfirm").hidden = false;
  m.querySelector("#sNo").onclick = () => m.querySelector("#sConfirm").hidden = true;
  m.querySelector("#sYes").onclick = () => { Object.assign(S, { stars: 0, done: {}, known: {}, rated: {}, stickers: [], mission: null }); save(); m.remove(); home(); toast("Fresh start!"); };
}

splash();

</script>
</body>
